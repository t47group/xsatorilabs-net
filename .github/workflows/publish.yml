name: Publish scheduled posts

on:
  schedule:
    # 13:00 UTC = 06:00 America/Phoenix (Arizona does not observe DST)
    - cron: '0 13 * * *'
  push:
    branches: [main]
    paths: ['posts/**', 'build.py', 'site.json', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 build.py

      - name: Commit any newly published posts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to publish today."
            exit 0
          fi
          git add -A
          git commit -m "Publish scheduled posts ($(date -u +%Y-%m-%d))"
          git push
